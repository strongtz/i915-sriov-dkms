name: Test

on:
  workflow_dispatch:
  push:
    branches:
      - "**"
    tags-ignore:
      - "[0-9]+.[0-9]+.[0-9]+"

jobs:
  test-proxmox-trixie:
    runs-on: ubuntu-26.04
    container:
      image: debian:trixie
    steps:
      - name: Install Dependencies
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y curl
          sh -c "echo deb http://download.proxmox.com/debian/pve trixie pve-no-subscription >> /etc/apt/sources.list"
          curl -o /etc/apt/trusted.gpg.d/proxmox-release-trixie.gpg https://enterprise.proxmox.com/debian/proxmox-release-trixie.gpg
          apt-get update
          apt-get install -y proxmox-archive-keyring
          apt-get upgrade -y
          apt-get install -y build-essential elfutils libelf-dev proxmox-default-headers
      - name: Checkout
        uses: actions/checkout@v7
        with:
          path: i915-sriov-dkms
      - name: Check Kernel Compatibility
        if: github.event_name != 'workflow_dispatch'
        id: check_kernel
        shell: bash
        working-directory: i915-sriov-dkms
        run: |
          KERNEL_SOURCE_DIR=$(dpkg -L $(dpkg -s $(dpkg -s proxmox-default-headers | grep "Depends: " | cut -d " " -f2) | grep "Depends: " | cut -d " " -f2) | grep -m 1 -Eo ".*/lib/modules/[^/]+/build")
          KERNELRELEASE=$(echo -n "$KERNEL_SOURCE_DIR" | sed 's/.*\/lib\/modules\///g;s/\/build//')
          echo "Detected kernel: $KERNELRELEASE"

          REGEX=$(grep '^BUILD_EXCLUSIVE_KERNEL=' dkms.conf | cut -d'"' -f2)

          if [[ ! "$KERNELRELEASE" =~ $REGEX ]]; then
            echo "Kernel $KERNELRELEASE not supported yet."
            echo "skip_build=true" >> $GITHUB_OUTPUT
          else
            echo "Kernel $KERNELRELEASE is supported."
            echo "skip_build=false" >> $GITHUB_OUTPUT
          fi
      - name: Build Module
        if: github.event_name == 'workflow_dispatch' || steps.check_kernel.outputs.skip_build == 'false'
        working-directory: i915-sriov-dkms
        run: |
          KERNEL_SOURCE_DIR=$(dpkg -L $(dpkg -s $(dpkg -s proxmox-default-headers | grep "Depends: " | cut -d " " -f2) | grep "Depends: " | cut -d " " -f2) | grep -m 1 -Eo ".*/lib/modules/[^/]+/build")
          KERNELRELEASE=$(echo -n "$KERNEL_SOURCE_DIR" | sed 's/.*\/lib\/modules\///g;s/\/build//')
          make -kj$(nproc) KERNELRELEASE=$KERNELRELEASE -C $KERNEL_SOURCE_DIR M=$(pwd)

  test-ubuntu-questing:
    runs-on: ubuntu-26.04
    container:
      image: ubuntu:questing
    steps:
      - name: Install Dependencies
        run: |
          sed -i 's/archive.ubuntu.com/azure.archive.ubuntu.com/g;s/security.ubuntu.com/azure.archive.ubuntu.com/g' /etc/apt/sources.list 2>/dev/null || true
          sed -i 's/archive.ubuntu.com/azure.archive.ubuntu.com/g;s/security.ubuntu.com/azure.archive.ubuntu.com/g' /etc/apt/sources.list.d/*.sources 2>/dev/null || true
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y git build-essential linux-headers-generic-6.17
      - name: Checkout
        uses: actions/checkout@v7
        with:
          path: i915-sriov-dkms
      - name: Check Kernel Compatibility
        if: github.event_name != 'workflow_dispatch'
        id: check_kernel
        shell: bash
        working-directory: i915-sriov-dkms
        run: |
          KERNEL_SOURCE_DIR=$(dpkg -L $(dpkg -s linux-headers-generic-6.17 | grep "Depends: " | cut -d " " -f2) | grep -m 1 -Eo ".*/lib/modules/[^/]+/build")
          KERNELRELEASE=$(echo -n "$KERNEL_SOURCE_DIR" | sed 's/.*\/lib\/modules\///g;s/\/build//')
          echo "Detected kernel: $KERNELRELEASE"

          REGEX=$(grep '^BUILD_EXCLUSIVE_KERNEL=' dkms.conf | cut -d'"' -f2)

          if [[ ! "$KERNELRELEASE" =~ $REGEX ]]; then
            echo "Kernel $KERNELRELEASE not supported yet."
            echo "skip_build=true" >> $GITHUB_OUTPUT
          else
            echo "Kernel $KERNELRELEASE is supported."
            echo "skip_build=false" >> $GITHUB_OUTPUT
          fi
      - name: Build Module
        working-directory: i915-sriov-dkms
        if: github.event_name == 'workflow_dispatch' || steps.check_kernel.outputs.skip_build == 'false'
        run: |
          KERNEL_SOURCE_DIR=$(dpkg -L $(dpkg -s linux-headers-generic-6.17 | grep "Depends: " | cut -d " " -f2) | grep -m 1 -Eo ".*/lib/modules/[^/]+/build")
          KERNELRELEASE=$(echo -n "$KERNEL_SOURCE_DIR" | sed 's/.*\/lib\/modules\///g;s/\/build//')
          make -kj$(nproc) KERNELRELEASE=$KERNELRELEASE -C $KERNEL_SOURCE_DIR M=$(pwd)

  test-archlinux:
    runs-on: ubuntu-26.04
    container:
      image: archlinux:base-devel
    steps:
      - name: Install Dependencies
        run: |
          pacman-key --init
          sed -i '/^#\[\(core\|extra\)-testing\]/,/^$/s/^#//' /etc/pacman.conf
          pacman -Syu --noconfirm git linux-headers
      - name: Checkout
        uses: actions/checkout@v7
        with:
          path: i915-sriov-dkms
      - name: Check Kernel Compatibility
        if: github.event_name != 'workflow_dispatch'
        id: check_kernel
        working-directory: i915-sriov-dkms
        run: |
          KERNEL_SOURCE_DIR=$(pacman -Qql linux-headers | grep -m 1 -Eo ".*/lib/modules/[^/]+/build")
          KERNELRELEASE=$(echo -n "$KERNEL_SOURCE_DIR" | sed 's/.*\/lib\/modules\///g;s/\/build//')
          echo "Detected kernel: $KERNELRELEASE"

          REGEX=$(grep '^BUILD_EXCLUSIVE_KERNEL=' dkms.conf | cut -d'"' -f2)

          if [[ ! "$KERNELRELEASE" =~ $REGEX ]]; then
            echo "Kernel $KERNELRELEASE not supported yet."
            echo "skip_build=true" >> $GITHUB_OUTPUT
          else
            echo "Kernel $KERNELRELEASE is supported."
            echo "skip_build=false" >> $GITHUB_OUTPUT
          fi
      - name: Build Module
        if: github.event_name == 'workflow_dispatch' || steps.check_kernel.outputs.skip_build == 'false'
        working-directory: i915-sriov-dkms
        run: |
          KERNEL_SOURCE_DIR=$(pacman -Qql linux-headers | grep -m 1 -Eo ".*/lib/modules/[^/]+/build")
          KERNELRELEASE=$(echo -n "$KERNEL_SOURCE_DIR" | sed 's/.*\/lib\/modules\///g;s/\/build//')
          sudo make -kj$(nproc) KERNELRELEASE=$KERNELRELEASE -C $KERNEL_SOURCE_DIR M=$(pwd)

